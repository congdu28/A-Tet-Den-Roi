<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="45%" stop-color="#5c0b16"/>
      <stop offset="100%" stop-color="#1f0308"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lanternBody" x1="0%" y1="0%" x2="100%" y2="100%">
