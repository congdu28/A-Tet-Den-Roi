  <path d="M0,1080 L0,950 Q220,920 420,955 L520,900 Q600,930 680,900 L780,960 Q1120,930 1440,955 L1540,890 Q1620,925 1710,890 L1820,950 L1920,935 L1920,1080 Z" fill="#180206" opacity="0.72"/>
