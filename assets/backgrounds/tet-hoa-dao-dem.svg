<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="daoNightBg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#450a14"/>
      <stop offset="100%" stop-color="#1a0308"/>
    </radialGradient>
    <radialGradient id="blossomGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <g id="daoNightFlower">
      <circle cx="0" cy="0" r="38" fill="url(#blossomGlow)"/>
      <circle cx="0" cy="-14" r="10.5" fill="#fda4af"/>
      <circle cx="13.5" cy="-4.5" r="10.5" fill="#fb7185"/>
      <circle cx="8.5" cy="11.5" r="10.5" fill="#fda4af"/>
      <circle cx="-8.5" cy="11.5" r="10.5" fill="#fecdd3"/>
      <circle cx="-13.5" cy="-4.5" r="10.5" fill="#fb7185"/>
      <circle cx="0" cy="0" r="4.8" fill="#fde047"/>
      <circle cx="-2" cy="-1.5" r="1.4" fill="#fffbeb"/>
      <circle cx="2" cy="1.2" r="1.4" fill="#fffbeb"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#daoNightBg)"/>
  <!-- Soft warm moonlight & lantern ambient glow -->
  <circle cx="1560" cy="240" r="280" fill="url(#goldOrb)" opacity="0.45"/>
  <circle cx="320" cy="740" r="260" fill="url(#blossomGlow)" opacity="0.5"/>
  <!-- Soft distant hills -->
  <path d="M0,920 Q500,830 980,900 T1920,860 L1920,1080 L0,1080 Z" fill="#2d060e" opacity="0.7"/>
  <!-- Top-Right Peach Branch (warm mahogany with soft highlight, never black) -->
  <path d="M1940,180 Q1680,220 1460,300 T1120,250" fill="none" stroke="#5c1d24" stroke-width="12" stroke-linecap="round"/>
  <path d="M1940,178 Q1680,218 1460,298 T1120,248" fill="none" stroke="#9f1239" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M1640,240 Q1540,150 1400,110" fill="none" stroke="#5c1d24" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom-Left Peach Branch -->
  <path d="M-20,820 Q220,740 420,660 T720,620" fill="none" stroke="#5c1d24" stroke-width="11" stroke-linecap="round"/>
  <path d="M-20,818 Q220,738 420,658 T720,618" fill="none" stroke="#9f1239" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M260,720 Q340,600 440,540" fill="none" stroke="#5c1d24" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Luminous Peach Blossoms -->
  <use href="#daoNightFlower" transform="translate(1780,205) scale(1.45)"/>
  <use href="#daoNightFlower" transform="translate(1620,245) scale(1.2)"/>
  <use href="#daoNightFlower" transform="translate(1480,295) scale(1.35)"/>
  <use href="#daoNightFlower" transform="translate(1420,120) scale(1.15)"/>
  <use href="#daoNightFlower" transform="translate(1270,275) scale(1.3)"/>
  <use href="#daoNightFlower" transform="translate(1130,250) scale(1.1)"/>
  <use href="#daoNightFlower" transform="translate(150,760) scale(1.45)"/>
  <use href="#daoNightFlower" transform="translate(290,700) scale(1.25)"/>
  <use href="#daoNightFlower" transform="translate(430,550) scale(1.2)"/>
  <use href="#daoNightFlower" transform="translate(520,645) scale(1.35)"/>
  <use href="#daoNightFlower" transform="translate(700,620) scale(1.15)"/>
  <!-- Warm glowing fireflies & drifting petals -->
  <g fill="#fde68a" opacity="0.55">
    <circle cx="480" cy="240" r="4"/><circle cx="760" cy="180" r="3"/><circle cx="1220" cy="480" r="4.5"/>
    <circle cx="1640" cy="620" r="3.5"/><circle cx="280" cy="410" r="3"/><circle cx="1390" cy="780" r="4"/>
  </g>
  <g fill="#fda4af" opacity="0.45">
    <ellipse cx="860" cy="340" rx="8" ry="4" transform="rotate(25 860 340)"/>
    <ellipse cx="1040" cy="540" rx="7" ry="4" transform="rotate(-20 1040 540)"/>
    <ellipse cx="640" cy="240" rx="8" ry="4" transform="rotate(35 640 240)"/>
    <ellipse cx="1320" cy="720" rx="9" ry="4.5" transform="rotate(-15 1320 720)"/>
  </g>
</svg>
