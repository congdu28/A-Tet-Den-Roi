<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="maiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <radialGradient id="sunWarm" cx="78%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fde047" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <g id="maiFlower">
      <circle cx="0" cy="-16" r="11" fill="#facc15"/>
      <circle cx="15" cy="-5" r="11" fill="#fbbf24"/>
      <circle cx="9" cy="13" r="11" fill="#facc15"/>
      <circle cx="-9" cy="13" r="11" fill="#fbbf24"/>
      <circle cx="-15" cy="-5" r="11" fill="#facc15"/>
      <circle cx="0" cy="0" r="5.5" fill="#b45309"/>
      <circle cx="-2" cy="-1" r="1.5" fill="#fef08a"/>
      <circle cx="2" cy="1" r="1.5" fill="#fef08a"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#maiBg)"/>
  <rect width="1920" height="1080" fill="url(#sunWarm)"/>
  <!-- Soft golden hills -->
  <path d="M0,920 Q480,820 980,900 T1920,860 L1920,1080 L0,1080 Z" fill="#f59e0b" opacity="0.14"/>
  <path d="M0,980 Q600,900 1200,970 T1920,940 L1920,1080 L0,1080 Z" fill="#d97706" opacity="0.16"/>
  <!-- Left Sweeping Mai Branch -->
  <path d="M-20,380 Q220,320 420,240 T760,160" fill="none" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
  <path d="M240,305 Q320,210 430,130" fill="none" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
  <path d="M460,225 Q560,290 680,275" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
  <!-- Right Sweeping Mai Branch -->
  <path d="M1940,680 Q1680,580 1480,470 T1180,380" fill="none" stroke="#78350f" stroke-width="13" stroke-linecap="round"/>
  <path d="M1640,560 Q1580,450 1460,350" fill="none" stroke="#78350f" stroke-width="7" stroke-linecap="round"/>
  <!-- Blossoms -->
  <use href="#maiFlower" transform="translate(140,335) scale(1.4)"/>
  <use href="#maiFlower" transform="translate(270,295) scale(1.2)"/>
  <use href="#maiFlower" transform="translate(360,190) scale(1.3)"/>
  <use href="#maiFlower" transform="translate(435,125) scale(1.1)"/>
  <use href="#maiFlower" transform="translate(520,210) scale(1.45)"/>
  <use href="#maiFlower" transform="translate(650,270) scale(1.15)"/>
  <use href="#maiFlower" transform="translate(755,160) scale(1.25)"/>
  <use href="#maiFlower" transform="translate(1780,610) scale(1.5)"/>
  <use href="#maiFlower" transform="translate(1620,540) scale(1.25)"/>
  <use href="#maiFlower" transform="translate(1490,465) scale(1.35)"/>
  <use href="#maiFlower" transform="translate(1465,355) scale(1.1)"/>
  <use href="#maiFlower" transform="translate(1310,415) scale(1.25)"/>
  <use href="#maiFlower" transform="translate(1190,380) scale(1.05)"/>
  <!-- Floating petals -->
  <g fill="#fbbf24" opacity="0.7">
    <ellipse cx="620" cy="460" rx="8" ry="4" transform="rotate(28 620 460)"/>
    <ellipse cx="920" cy="310" rx="7" ry="4" transform="rotate(-18 920 310)"/>
