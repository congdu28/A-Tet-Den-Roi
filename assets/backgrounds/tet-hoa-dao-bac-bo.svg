<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="daoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <radialGradient id="daoSun" cx="25%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <g id="daoFlower">
      <circle cx="0" cy="-15" r="11" fill="#fb7185"/>
      <circle cx="14" cy="-5" r="11" fill="#f43f5e"/>
      <circle cx="9" cy="12" r="11" fill="#fb7185"/>
      <circle cx="-9" cy="12" r="11" fill="#fda4af"/>
      <circle cx="-14" cy="-5" r="11" fill="#f43f5e"/>
      <circle cx="0" cy="0" r="5" fill="#fde047"/>
    </g>
  </defs>
  <rect width="1920" height="1080" fill="url(#daoBg)"/>
  <rect width="1920" height="1080" fill="url(#daoSun)"/>
  <!-- Misty hills -->
  <path d="M0,900 Q500,810 980,880 T1920,850 L1920,1080 L0,1080 Z" fill="#fb7185" opacity="0.14"/>
  <path d="M0,970 Q640,910 1280,975 T1920,940 L1920,1080 L0,1080 Z" fill="#e11d48" opacity="0.12"/>
  <!-- Top-Right Peach Branch -->
  <path d="M1940,180 Q1680,220 1460,300 T1120,250" fill="none" stroke="#57262d" stroke-width="13" stroke-linecap="round"/>
  <path d="M1640,240 Q1540,150 1400,110" fill="none" stroke="#57262d" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom-Left Peach Branch -->
  <path d="M-20,820 Q220,740 420,660 T720,620" fill="none" stroke="#57262d" stroke-width="12" stroke-linecap="round"/>
  <path d="M260,720 Q340,600 440,540" fill="none" stroke="#57262d" stroke-width="7" stroke-linecap="round"/>
  <!-- Peach Blossoms -->
  <use href="#daoFlower" transform="translate(1780,205) scale(1.4)"/>
  <use href="#daoFlower" transform="translate(1620,245) scale(1.2)"/>
  <use href="#daoFlower" transform="translate(1480,295) scale(1.35)"/>
  <use href="#daoFlower" transform="translate(1420,120) scale(1.15)"/>
  <use href="#daoFlower" transform="translate(1270,275) scale(1.3)"/>
  <use href="#daoFlower" transform="translate(1130,250) scale(1.1)"/>
  <use href="#daoFlower" transform="translate(150,760) scale(1.45)"/>
  <use href="#daoFlower" transform="translate(290,700) scale(1.25)"/>
  <use href="#daoFlower" transform="translate(430,550) scale(1.2)"/>
  <use href="#daoFlower" transform="translate(520,645) scale(1.35)"/>
  <use href="#daoFlower" transform="translate(700,620) scale(1.15)"/>
  <!-- Drifting petals -->
  <g fill="#fb7185" opacity="0.55">
    <ellipse cx="850" cy="360" rx="8" ry="4" transform="rotate(25 850 360)"/>
    <ellipse cx="1020" cy="520" rx="7" ry="4" transform="rotate(-20 1020 520)"/>
    <ellipse cx="640" cy="240" rx="8" ry="4" transform="rotate(35 640 240)"/>
    <ellipse cx="1340" cy="700" rx="9" ry="4.5" transform="rotate(-15 1340 700)"/>
