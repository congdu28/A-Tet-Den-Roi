<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="lacquer" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="55%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#3b070c"/>
    </radialGradient>
    <radialGradient id="goldCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#lacquer)"/>
  <circle cx="960" cy="540" r="560" fill="url(#goldCenter)"/>
  <!-- Dong Son Concentric Rings -->
  <g transform="translate(960,540)" fill="none" stroke="#fbbf24" opacity="0.22">
    <circle r="110" stroke-width="3"/>
    <circle r="185" stroke-width="2" stroke-dasharray="14 10"/>
    <circle r="270" stroke-width="2.5"/>
    <circle r="365" stroke-width="2" stroke-dasharray="20 12"/>
    <circle r="460" stroke-width="3"/>
    <circle r="560" stroke-width="1.5" stroke-dasharray="10 14"/>
    <!-- 12-point sun rays -->
    <g stroke-width="2" opacity="0.7">
      <line x1="0" y1="-110" x2="0" y2="-270"/><line x1="0" y1="110" x2="0" y2="270"/>
      <line x1="-110" y1="0" x2="-270" y2="0"/><line x1="110" y1="0" x2="270" y2="0"/>
      <line x1="-78" y1="-78" x2="-190" y2="-190"/><line x1="78" y1="78" x2="190" y2="190"/>
      <line x1="78" y1="-78" x2="190" y2="-190"/><line x1="-78" y1="78" x2="-190" y2="190"/>
    </g>
  </g>
  <!-- Corner Auspicious Frames -->
  <g fill="none" stroke="#fde047" stroke-width="3" opacity="0.35">
    <path d="M60,180 L60,60 L180,60"/>
    <path d="M1740,60 L1860,60 L1860,180"/>
    <path d="M60,900 L60,1020 L180,1020"/>
    <path d="M1740,1020 L1860,1020 L1860,900"/>
  </g>
</svg>
